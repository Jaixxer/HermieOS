name: hermieos

# Full local stack: Postgres, API, MCP, scheduler, fake-hermes (default),
# and the real Hermes (opt-in via `docker compose --profile real up`).
#
# Two profiles:
#   - default: postgres, api, mcp, scheduler, fake-hermes
#       Use for tests, CI, and the demo. No real Hermes needed.
#       `docker compose up`
#   - real: also brings up the real Hermes container wired to the MCP
#       Use for Phase 6+ work. Requires HERMES_USER_EMAIL set and
#       a HermieOS user with that email already in the DB.
#       `docker compose --profile real up`

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hermieos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermieos
      POSTGRES_PASSWORD: hermieos
      POSTGRES_DB: hermieos
    # 15432 on the host to avoid clashing with a host-local Postgres
    # that's typically on 127.0.0.1:5432.
    ports:
      - "15432:5432"
    volumes:
      - hermieos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermieos -d hermieos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The "fake Hermes" stand-in. Same /v1 surface as the real thing,
  # records envelopes, returns immediately. Use for tests and the demo.
  fake-hermes:
    image: node:22-alpine
    container_name: hermieos-fake-hermes
    working_dir: /app
    command: ["node", "fake-hermes.js"]
    environment:
      PORT: "4100"
    ports:
      - "4100:4100"
    volumes:
      - ./packages/scheduler/fake-hermes-docker.js:/app/fake-hermes.js:ro

  # SearXNG — privacy-respecting metasearch engine used by Hermes
  # for web_search. Two persistent volumes (config + data) so settings,
  # favicon cache, and rate-limit state survive container recreates.
  # The 8888 host port is what the host browser / Hermes profile use.
  searxng:
    image: searxng/searxng:latest
    container_name: hermieos-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/config:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      # SEARXNG_SECRET is read at startup and substituted into settings.yml's
      # server.secret_key. Rotate to invalidate cached cookies.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-local-dev}
      SEARXNG_BIND_ADDRESS: "0.0.0.0:8080"
      # What Hermes uses to reach SearXNG inside the compose network.
      SEARXNG_BASE_URL: http://searxng:8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermieos-api
    restart: unless-stopped
    environment:
      SERVICE: api
      PORT: "3001"
      DATABASE_URL: postgres://hermieos:hermieos@postgres:5432/hermieos
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PUSH_VAPID_PUBLIC: ${PUSH_VAPID_PUBLIC:-}
      PUSH_VAPID_PRIVATE: ${PUSH_VAPID_PRIVATE:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:admin@hermieos.local}
      HERMES_GATEWAY_URL: ${HERMES_GATEWAY_URL:-http://hermes:8642}
      HERMES_PUBLIC_URL: ${HERMES_PUBLIC_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:-http://hermes:9119}
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-http://localhost:9119}
      HERMES_DASHBOARD_USERNAME: ${HERMES_DASHBOARD_USERNAME:-hermieos}
      HERMES_DASHBOARD_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermieos-mcp
    restart: unless-stopped
    environment:
      SERVICE: mcp
      PORT: "3002"
      DATABASE_URL: postgres://hermieos:hermieos@postgres:5432/hermieos
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PUSH_VAPID_PUBLIC: ${PUSH_VAPID_PUBLIC:-}
      PUSH_VAPID_PRIVATE: ${PUSH_VAPID_PRIVATE:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:admin@hermieos.local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermieos-scheduler
    restart: unless-stopped
    environment:
      SERVICE: scheduler
      DATABASE_URL: postgres://hermieos:hermieos@postgres:5432/hermieos
      # In the default profile we point at fake-hermes. With --profile real,
      # the hermes service is on the same compose network; the scheduler
      # can reach it at http://hermes:8642.
      HERMES_GATEWAY_URL: ${HERMES_GATEWAY_URL:-http://fake-hermes:4100}
      HERMES_API_KEY: ${HERMES_API_KEY:-demo-key}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-60000}
      RUN_TRACKER_POLL_MS: ${RUN_TRACKER_POLL_MS:-5000}
      RUN_DEADLINE_MS: ${RUN_DEADLINE_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      fake-hermes:
        condition: service_started
      api:
        condition: service_started
      mcp:
        condition: service_started

  # Real Hermes. Opt-in via `docker compose --profile real up`.
  # Reads profile config from the hermes-config volume (shared with
  # the hermes-init generator). The generator runs first and produces
  # profiles/<name>/config.yaml + .env from the user's mcp_token.
  hermes-init:
    build:
      context: .
      dockerfile: packages/scripts/Dockerfile
    container_name: hermieos-hermes-init
    environment:
      DATABASE_URL: postgres://hermieos:hermieos@postgres:5432/hermieos
      HERMES_USER_EMAIL: ${HERMES_USER_EMAIL:-}
      HERMES_PROFILE_NAME: ${HERMES_PROFILE_NAME:-}
      # Hermes's data dir. The official image mounts it at /opt/data and
      # keeps /opt/hermes reserved for the runtime (venv, bin, etc.).
      HERMES_HOME: /opt/data
      HERMES_API_PORT: ${HERMES_API_PORT:-8642}
      HERMES_API_HOST: ${HERMES_API_HOST:-0.0.0.0}
      # When unset, hermes-profile-gen writes a fresh key. When set
      # (e.g. via .env), it uses this value and reuses the existing
      # .env's API_SERVER_KEY if present.
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMIEOS_MCP_MODE: ${HERMIEOS_MCP_MODE:-docker}
      HERMES_MCP_URL: ${HERMES_MCP_URL:-}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-auto}
      HERMES_INFERENCE_BASE_URL: ${HERMES_INFERENCE_BASE_URL:-}
      # When unset, hermes-profile-gen writes the main $HERMES_HOME/config.yaml
      # (not profiles/<name>/config.yaml). The gateway reads the main config
      # by default; explicit HERMES_PROFILE_NAME switches to a profile.
    volumes:
      # Named volume (managed by Docker) instead of a bind mount, so the
      # container's UID 10000 owns the files without host-side chown.
      # Pre-populate with `docker run --rm -v hermes-data:/opt/data
      # -v /path/to/host/hermes-data:/seed alpine cp -a /seed/. /opt/data/`
      # to copy the existing config in.
      - hermes-data:/opt/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["real"]
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermieos-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      # Dashboard auth — the dashboard hosts /api/ws (the TUI gateway
      # used for steer / interrupt / approvals). A non-loopback bind
      # requires an auth provider or the dashboard fails closed.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:-hermieos}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
      # Browser/mobile origins allowed to call Hermes' API server directly.
      API_SERVER_CORS_ORIGINS: ${API_SERVER_CORS_ORIGINS:-http://localhost,https://localhost}
      # The cached credential in auth.json was originally sourced from
      # the OPENCODE_GO_API_KEY env var. Without it, the credential is
      # considered stale. Override here to keep the cached model working.
      # (For production, rotate to a fresh API key and `hermes auth add`.)
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      # Web search via the local SearXNG container. Inside the compose
      # network searxng is reachable as http://searxng:8080.
      SEARXNG_URL: http://searxng:8080
    volumes:
      - hermes-data:/opt/data
    ports:
      - "${HERMES_API_PORT:-8642}:8642"
      - "9119:9119"
    depends_on:
      hermes-init:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    profiles: ["real"]
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  hermieos-pgdata:
  searxng-data:
  hermes-data:
    # Pre-populated by the user before `docker compose up`. To reseed
    # from an existing host dir, run:
    #   docker run --rm -v hermieos_hermes-data:/opt/data \
    #     -v /path/to/host/hermes-data:/seed alpine \
    #     sh -c "cp -a /seed/. /opt/data/ && chown -R 10000:10000 /opt/data"
    name: hermieos_hermes-data
